  # ============================================================
# FeedForward — Configuration File
# Edit thresholds here or via the in-app Settings panel.
# All time values are in seconds unless noted otherwise.
# ============================================================

# ----------------------------------------------------------
# Conflict Rule Engine — Headway Thresholds
# ----------------------------------------------------------
headway:
  # Minimum acceptable gap (seconds) between two consecutive
  # trips at the same stop, same direction, same line.
  # WR suburban typical minimum operating headway: 3 minutes.
  min_headway_sec: 30

  # Headway below this value is flagged as CRITICAL severity.
  critical_headway_sec: 15

  # Headway between critical and min is flagged as WARNING.
  # (i.e. 90s < headway < 180s → WARNING)

# ----------------------------------------------------------
# Conflict Rule Engine — Platform Clash
# ----------------------------------------------------------
platform_clash:
  # Enable platform-clash detection.
  # Automatically skipped if the feed has no platform-level
  # stop_id granularity (station-level feeds are unaffected).
  enabled: true

  # Minimum dwell separation (seconds) between two trips
  # sharing the same platform stop_id.
  min_platform_separation_sec: 60

# ----------------------------------------------------------
# Accessibility Engine
# ----------------------------------------------------------
accessibility:
  # Default reachability window (minutes) for isochrone
  # computation. User can override this in the UI.
  default_window_minutes: 30

  # Transfer wait buffer added at each interchange stop (seconds).
  transfer_buffer_sec: 120

  # Maximum number of transfers allowed in a single journey.
  max_transfers: 2

# ----------------------------------------------------------
# Connection Impact (Stop Add / Remove)
# ----------------------------------------------------------
connection_impact:
  # Window (minutes) within which same-line trips at a stop
  # are counted as potential connections affected by a stop
  # addition or removal.
  transfer_window_minutes: 5

# ----------------------------------------------------------
# Scenario Engine
# ----------------------------------------------------------
scenario:
  # Prefix used for trip_ids generated by new-trip additions.
  # Distinguishes scenario trips from baseline trips.
  generated_trip_id_prefix: "WR_SCEN_"

  # Maximum number of active changes per scenario.
  # Soft limit — UI warns but does not hard-block.
  max_changes_per_scenario: 100

# ----------------------------------------------------------
# GTFS Export
# ----------------------------------------------------------
export:
  # Default export filename pattern.
  # Supports strftime tokens: %Y %m %d %H %M
  default_filename_pattern: "feedforward_export_%Y-%m-%d_%H%M.zip"

  # Directory (relative to project root) where exports are saved.
  export_dir: "exports"

  # Re-validate with gtfs-kit after export before offering download.
  revalidate_on_export: true

# ----------------------------------------------------------
# ML Models
# ----------------------------------------------------------
ml:
  # Path (relative to project root) where serialized models are stored.
  model_dir: "ml/models"

  # Random Forest — Delay Magnitude Estimator
  delay_estimator:
    model_file: "delay_estimator.joblib"
    # Confidence threshold below which the estimate is shown
    # with a low-confidence warning in the UI.
    low_confidence_threshold: 0.55

  # Headway Pattern Classifier
  headway_classifier:
    model_file: "headway_classifier.joblib"
    low_confidence_threshold: 0.60

  # Crowding / Load-Factor Model (core ML component)
  crowding_model:
    model_file: "crowding_model.joblib"
    low_confidence_threshold: 0.60
    # Load factor above which a segment is considered overcrowded.
    overcrowding_threshold: 0.85

# ----------------------------------------------------------
# Optional AI Explanation Layer
# ----------------------------------------------------------
ai_explanation:
  # Set to false to hide the "Explain this conflict" button
  # entirely from the UI.
  enabled: true

  # LLM model identifier passed to the explanation API call.
  model: "claude-sonnet-4-6"

  # Maximum tokens for the plain-English explanation response.
  max_tokens: 300

# ----------------------------------------------------------
# Logging
# ----------------------------------------------------------
logging:
  # Options: DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # Log file path relative to project root.
  # Set to null to log to stdout only.
  log_file: "logs/feedforward.log"
